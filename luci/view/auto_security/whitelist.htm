<%+header%>
<div class="cbi-map" id="auto-security-whitelist">
    <h2><%= _("Whitelist Management") %></h2>
    <div class="cbi-map-descr">
        <%= _("IP addresses and CIDR ranges that will never be banned. Add your management IPs here.") %>
    </div>

    <div class="cbi-section">
        <div class="cbi-value">
            <label><%= _("Add to Whitelist") %></label>
            <div class="cbi-value-field">
                <input type="text" id="whitelist-input" class="cbi-input-text" placeholder="192.168.1.100 or 10.0.0.0/8">
                <button class="btn btn-success" id="whitelist-add-btn"><%= _("Add") %></button>
            </div>
        </div>
        <div class="cbi-value">
            <label><%= _("API Password") %></label>
            <div class="cbi-value-field">
                <input type="password" id="api-password" class="cbi-input-password" placeholder="<%= _("Required for changes (set in Settings)") %>">
            </div>
        </div>
    </div>

    <div class="cbi-section">
        <table class="table table-striped" id="whitelist-table">
            <thead>
                <tr>
                    <th><%= _("Entry") %></th>
                    <th><%= _("Type") %></th>
                    <th><%= _("Action") %></th>
                </tr>
            </thead>
            <tbody id="whitelist-tbody">
                <tr><td colspan="3" class="text-center"><%= _("Loading...") %></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function escapeHtml(text) {
        return String(text == null ? "" : text)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function fetchJson(url, options) {
        options = options || {};
        options.credentials = 'same-origin';
        return fetch(url, options).then(function(response) {
            if (!response.ok) { throw new Error('HTTP ' + response.status); }
            return response.text().then(function(text) {
                try { return JSON.parse(text); }
                catch (e) { throw new Error('Invalid server response: ' + text.substring(0, 120)); }
            });
        });
    }

    function apiPassword() {
        var el = document.getElementById('api-password');
        return el ? el.value : '';
    }

    function loadWhitelist() {
        fetchJson('/cgi-bin/auto-security/api/whitelist')
            .then(function(data) { parseWhitelistOutput(data.output || ''); })
            .catch(function(err) {
                document.getElementById('whitelist-tbody').innerHTML =
                    '<tr><td colspan="3" class="text-center error">Error: ' + escapeHtml(err.message || err) + '</td></tr>';
            });
    }

    function parseWhitelistOutput(output) {
        var lines = String(output).split('\n');
        var tbody = document.getElementById('whitelist-tbody');
        tbody.innerHTML = '';
        var hasEntries = false;
        lines.forEach(function(line) {
            line = line.trim();
            if (!line || line.charAt(0) === '#' ||
                line.indexOf('WHITELIST') === 0 || line.indexOf('ENTRIES') === 0) { return; }
            hasEntries = true;
            var type = line.indexOf('/') >= 0 ? '<%= _("CIDR") %>' : '<%= _("IP") %>';
            var row = document.createElement('tr');
            row.innerHTML =
                '<td>' + escapeHtml(line) + '</td><td>' + type + '</td>' +
                '<td><button class="btn btn-danger btn-xs" data-entry="' + escapeHtml(line) + '"><%= _("Remove") %></button></td>';
            row.querySelector('button').addEventListener('click', function() { removeWhitelist(line); });
            tbody.appendChild(row);
        });
        if (!hasEntries) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center"><%= _("No whitelist entries") %></td></tr>';
        }
    }

    function addWhitelist() {
        var input = document.getElementById('whitelist-input');
        var entry = input.value.trim();
        if (!entry) { alert('<%= _("Enter an IP or CIDR") %>'); return; }
        fetchJson('/cgi-bin/auto-security/api/whitelist-add', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'ip=' + encodeURIComponent(entry) + '&api_password=' + encodeURIComponent(apiPassword())
        }).then(function(data) {
            if (!data.success) { alert('<%= _("Error") %>: ' + (data.error || '<%= _("Unknown error") %>')); return; }
            input.value = '';
            loadWhitelist();
        }).catch(function(err) { alert('<%= _("Error") %>: ' + (err.message || err)); });
    }

    function removeWhitelist(entry) {
        if (!confirm('<%= _("Remove") %> ' + entry + '?')) return;
        fetchJson('/cgi-bin/auto-security/api/whitelist-remove', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'ip=' + encodeURIComponent(entry) + '&api_password=' + encodeURIComponent(apiPassword())
        }).then(function(data) {
            if (!data.success) { alert('<%= _("Error") %>: ' + (data.error || '<%= _("Unknown error") %>')); return; }
            loadWhitelist();
        }).catch(function(err) { alert('<%= _("Error") %>: ' + (err.message || err)); });
    }

    document.getElementById('whitelist-add-btn').addEventListener('click', addWhitelist);
    loadWhitelist();
</script>

<%+footer%>
