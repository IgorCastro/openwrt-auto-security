<%+header%>
<div class="cbi-map" id="auto-security-logs">
    <h2><%= _("Auto-Security Logs") %></h2>
    <div class="cbi-map-descr">
        <%= _("Ban activity and system logs") %>
    </div>

    <div class="cbi-section">
        <div class="btn-group" role="group">
            <button class="btn btn-default active" id="btn-banlog"><%= _("Ban Log") %></button>
            <button class="btn btn-default" id="btn-cidrlog"><%= _("CIDR Ban Log") %></button>
            <button class="btn btn-default" id="btn-system"><%= _("System Log (auto-security)") %></button>
        </div>
    </div>

    <div class="cbi-section">
        <div id="log-ban" class="log-panel">
            <pre id="log-ban-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
        <div id="log-cidr" class="log-panel" style="display:none;">
            <pre id="log-cidr-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
        <div id="log-system" class="log-panel" style="display:none;">
            <pre id="log-system-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
    </div>
</div>

<style>
.log-panel { max-height: 500px; overflow-y: auto; }
.log-content { white-space: pre-wrap; font-family: monospace; font-size: 12px; }
.btn-group .btn.active { background-color: #337ab7; color: white; }
</style>

<script>
    function escapeHtml(text) {
        return String(text == null ? "" : text)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showLog(type) {
        document.querySelectorAll('.btn-group .btn').forEach(function(btn) { btn.classList.remove('active'); });
        document.getElementById('btn-' + type).classList.add('active');
        document.querySelectorAll('.log-panel').forEach(function(panel) { panel.style.display = 'none'; });
        document.getElementById('log-' + type).style.display = 'block';
        loadLog(type);
    }

    function loadLog(type) {
        var contentEl = document.getElementById('log-' + type + '-content');
        contentEl.textContent = '<%= _("Loading...") %>';
        var action = (type === 'ban') ? 'status' : (type === 'cidr' ? 'banned' : 'live');
        fetch('/cgi-bin/auto-security/api/' + action, {credentials: 'same-origin'})
            .then(function(response) {
                if (!response.ok) { throw new Error('HTTP ' + response.status); }
                return response.text().then(function(text) {
                    try { return JSON.parse(text); }
                    catch (e) { throw new Error('Invalid server response: ' + text.substring(0, 120)); }
                });
            })
            .then(function(data) {
                contentEl.textContent = data.output || '<%= _("No log entries") %>';
            })
            .catch(function(err) {
                contentEl.textContent = 'Error: ' + (err.message || err);
            });
    }

    document.getElementById('btn-banlog').addEventListener('click', function() { showLog('ban'); });
    document.getElementById('btn-cidrlog').addEventListener('click', function() { showLog('cidr'); });
    document.getElementById('btn-system').addEventListener('click', function() { showLog('system'); });
    document.addEventListener('DOMContentLoaded', function() { loadLog('ban'); });
    loadLog('ban');
</script>

<%+footer%>
