<%+header%>
<div class="cbi-map" id="auto-security-logs">
    <h2><%= _("Auto-Security Logs") %></h2>
    <div class="cbi-map-descr">
        <%= _("Ban activity and system logs") %>
    </div>

    <div class="cbi-section">
        <div class="btn-group" role="group">
            <button class="btn btn-default active" id="btn-banlog" onclick="showLog('ban')"><%= _("Ban Log") %></button>
            <button class="btn btn-default" id="btn-cidrlog" onclick="showLog('cidr')"><%= _("CIDR Ban Log") %></button>
            <button class="btn btn-default" id="btn-correlation" onclick="showLog('correlation')"><%= _("Correlation Log") %></button>
            <button class="btn btn-default" id="btn-system" onclick="showLog('system')"><%= _("System Log (auto-security)") %></button>
        </div>
    </div>

    <div class="cbi-section">
        <div id="log-ban" class="log-panel">
            <pre id="log-ban-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
        <div id="log-cidr" class="log-panel" style="display:none;">
            <pre id="log-cidr-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
        <div id="log-correlation" class="log-panel" style="display:none;">
            <pre id="log-correlation-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
        <div id="log-system" class="log-panel" style="display:none;">
            <pre id="log-system-content" class="log-content"><%= _("Loading...") %></pre>
        </div>
    </div>
</div>

<style>
.log-panel { max-height: 500px; overflow-y: auto; }
.log-content { white-space: pre-wrap; font-family: monospace; font-size: 12px; }
.btn-group .btn.active { background-color: #337ab7; color: white; }
</style>

<script>
    function showLog(type) {
        // Update button states
        document.querySelectorAll('.btn-group .btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');
        
        // Show/hide panels
        document.querySelectorAll('.log-panel').forEach(panel => panel.style.display = 'none');
        document.getElementById('log-' + type).style.display = 'block';
        
        // Load content if not loaded
        loadLog(type);
    }

    function loadLog(type) {
        const contentEl = document.getElementById('log-' + type + '-content');
        if (contentEl.dataset.loaded === 'true') return;
        
        let cmd;
        switch(type) {
            case 'ban': cmd = 'cat /opt/auto-security/logs/banned_ips.log 2>/dev/null | tail -100'; break;
            case 'cidr': cmd = 'cat /opt/auto-security/logs/cidr_banlist.txt 2>/dev/null | tail -100'; break;
            case 'correlation': cmd = 'cat /opt/auto-security/logs/correlation.log 2>/dev/null | tail -100'; break;
            case 'system': cmd = 'logread -e AUTO-SECURITY 2>/dev/null | tail -100'; break;
        }
        
        fetch('<%= luci.dispatcher.build_url("admin/services/auto_security/api/scan") %>', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'cmd=' + encodeURIComponent(cmd)
        })
        .then(response => response.json())
        .then(data => {
            // We'll use a different approach - direct file read via API
            fetch('<%= luci.dispatcher.build_url("admin/services/auto_security/api/status") %>')
                .then(r => r.json())
                .then(d => {
                    // For logs, we'll read directly
                    fetch('/cgi-bin/luci/admin/services/auto_security/api/log?type=' + type)
                        .then(r => r.text())
                        .then(text => {
                            document.getElementById('log-' + type + '-content').textContent = text || '<%= _("No log entries") %>';
                        })
                        .catch(() => {
                            document.getElementById('log-' + type + '-content').textContent = '<%= _("Log file not found or empty") %>';
                        });
                });
        });
        
        // Simpler approach - use the existing API
        contentEl.textContent = '<%= _("Loading...") %>';
    }

    // Load ban log by default
    document.addEventListener('DOMContentLoaded', () => loadLog('ban'));
</script>

<%+footer%>
