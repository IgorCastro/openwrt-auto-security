<%+header%>
<div class="cbi-map" id="auto-security-banned">
    <h2><%= _("Banned IPs") %></h2>
    <div class="cbi-map-descr">
        <%= _("Currently banned IP addresses. Click Unban to remove a ban.") %>
    </div>

    <div class="cbi-section">
        <table class="table table-striped" id="banned-table">
            <thead>
                <tr>
                    <th><%= _("IP Address") %></th>
                    <th><%= _("Details") %></th>
                    <th><%= _("Action") %></th>
                </tr>
            </thead>
            <tbody id="banned-tbody">
                <tr><td colspan="3" class="text-center"><%= _("Loading...") %></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function escapeHtml(text) {
        return String(text == null ? "" : text)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function fetchJson(url, options) {
        options = options || {};
        options.credentials = 'same-origin';
        return fetch(url, options).then(function(response) {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.text().then(function(text) {
                try {
                    return JSON.parse(text);
                } catch (e) {
                    throw new Error('Invalid server response: ' + text.substring(0, 120));
                }
            });
        });
    }

    function loadBanned() {
        fetchJson('/cgi-bin/auto-security/api/banned')
            .then(function(data) {
                parseBannedOutput(data.output || '');
            })
            .catch(function(err) {
                document.getElementById('banned-tbody').innerHTML =
                    '<tr><td colspan="3" class="text-center error">Error: ' + escapeHtml(err.message || err) + '</td></tr>';
            });
    }

    function parseBannedOutput(output) {
        var lines = String(output).split('\n');
        var tbody = document.getElementById('banned-tbody');
        tbody.innerHTML = '';
        var hasBanned = false;
        lines.forEach(function(line) {
            line = line.trim();
            if (!line || line.charAt(0) === '=' || line.charAt(0) === '-' ||
                line.indexOf('BANNED') === 0 || line.indexOf('IP Address') === 0 ||
                line.indexOf('No ') === 0 || line.indexOf('CURRENTLY') === 0) {
                return;
            }
            var m = line.match(/^(\S+)\s*\|\s*(\S+)\s*\|\s*(\S+)\s*\|\s*(.+)$/);
            if (m) {
                hasBanned = true;
                var row = document.createElement('tr');
                row.innerHTML =
                    '<td>' + escapeHtml(m[1]) + '</td>' +
                    '<td>' + escapeHtml(m[2] + ' / ' + m[3] + ' / ' + m[4]) + '</td>' +
                    '<td><button class="btn btn-danger btn-xs" data-ip="' + escapeHtml(m[1]) + '"><%= _("Unban") %></button></td>';
                row.querySelector('button').addEventListener('click', function() { unbanIp(m[1]); });
                tbody.appendChild(row);
                return;
            }
            var ip = line.match(/^(\d+\.\d+\.\d+\.\d+|[0-9a-fA-F:]+)(\/\d+)?$/);
            if (ip) {
                hasBanned = true;
                var row2 = document.createElement('tr');
                row2.innerHTML =
                    '<td>' + escapeHtml(ip[0]) + '</td><td></td>' +
                    '<td><button class="btn btn-danger btn-xs" data-ip="' + escapeHtml(ip[0]) + '"><%= _("Unban") %></button></td>';
                row2.querySelector('button').addEventListener('click', function() { unbanIp(ip[0]); });
                tbody.appendChild(row2);
            }
        });
        if (!hasBanned) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center"><%= _("No banned IPs") %></td></tr>';
        }
    }

    function unbanIp(ip) {
        if (!confirm('<%= _("Unban IP") %> ' + ip + '?')) return;
        var apiPass = (document.getElementById('api-password') && document.getElementById('api-password').value) || '';
        fetchJson('/cgi-bin/auto-security/api/unban', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'ip=' + encodeURIComponent(ip) + '&api_password=' + encodeURIComponent(apiPass)
        }).then(function(data) {
            if (!data.success) { alert('<%= _("Error") %>: ' + (data.error || '<%= _("Unknown error") %>')); return; }
            alert((data.output || '<%= _("Done") %>'));
            loadBanned();
        }).catch(function(err) { alert('<%= _("Error") %>: ' + (err.message || err)); });
    }

    setInterval(loadBanned, 15000);
    loadBanned();
</script>

<%+footer%>
