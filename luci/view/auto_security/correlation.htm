<%+header%>
<div class="cbi-map" id="auto-security-correlation">
    <h2><%= _("Service Correlation") %></h2>
    <div class="cbi-map-descr">
        <%= _("Correlation analysis between attacks and service status (mwan3, AdGuard, netdata)") %>
    </div>

    <div class="cbi-section">
        <button class="btn btn-primary" id="correlation-refresh">
            <span class="glyphicon glyphicon-refresh"></span> <%= _("Refresh Correlation Report") %>
        </button>
    </div>

    <div class="cbi-section">
        <div id="correlation-content">
            <div class="text-center"><%= _("Click refresh to load correlation report") %></div>
        </div>
    </div>
</div>

<script>
    function escapeHtml(text) {
        return String(text == null ? "" : text)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function loadCorrelation() {
        var contentEl = document.getElementById('correlation-content');
        contentEl.innerHTML = '<div class="text-center"><%= _("Loading...") %></div>';
        fetch('/cgi-bin/auto-security/api/correlation', {credentials: 'same-origin'})
            .then(function(response) {
                if (!response.ok) { throw new Error('HTTP ' + response.status); }
                return response.text().then(function(text) {
                    try { return JSON.parse(text); }
                    catch (e) { throw new Error('Invalid server response: ' + text.substring(0, 120)); }
                });
            })
            .then(function(data) {
                contentEl.innerHTML = '<pre style="white-space: pre-wrap; font-family: monospace;">' + escapeHtml(data.output || '') + '</pre>';
            })
            .catch(function(err) {
                contentEl.innerHTML = '<div class="error">Error: ' + escapeHtml(err.message || err) + '</div>';
            });
    }

    document.getElementById('correlation-refresh').addEventListener('click', loadCorrelation);
    document.addEventListener('DOMContentLoaded', loadCorrelation);
    loadCorrelation();
</script>

<%+footer%>
