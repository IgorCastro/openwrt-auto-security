<%+header%>
<div class="cbi-map" id="auto-security-overview">
    <h2><%= _("Auto-Security Overview") %></h2>
    <div id="overview-content">
        <div class="loading"><%= _("Loading...") %></div>
    </div>
</div>

<script>
    function escapeHtml(text) {
        return String(text == null ? "" : text)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function loadOverview() {
        fetch('/cgi-bin/auto-security/api/status', {credentials: 'same-origin'})
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return response.text().then(function(text) {
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('Invalid server response: ' + text.substring(0, 120));
                    }
                });
            })
            .then(function(data) {
                document.getElementById('overview-content').innerHTML =
                    '<pre style="white-space: pre-wrap; font-family: monospace;">' + escapeHtml(data.output || '') + '</pre>';
            })
            .catch(function(err) {
                document.getElementById('overview-content').innerHTML =
                    '<div class="error">Error loading overview: ' + escapeHtml(err.message || err) + '</div>';
            });
    }

    setInterval(loadOverview, 30000);
    loadOverview();
</script>

<%+footer%>
