# OpenWRT Auto-Security Configuration v2.0
# Enhanced with IPv6, Whitelist, CIDR, Correlation, Alerts

# ============================================================
# CORE DETECTION SETTINGS
# ============================================================

# Attack detection threshold (number of attacks before auto-ban)
ATTACK_THRESHOLD=3

# How often to run auto-ban detection (in minutes)
SCAN_INTERVAL=10

# Ban duration (in seconds, 3600 = 1 hour, 86400 = 24h, 0 = permanent)
BAN_DURATION=0

# Log retention (in days) - for log rotation
LOG_RETENTION=30

# Scan period format for logread matching
SCAN_PERIOD="$(date +'%b %d')"

# ============================================================
# IPV6 SUPPORT
# ============================================================

# Enable IPv6 attack detection and blocking (1=enable, 0=disable)
ENABLE_IPV6=1

# ============================================================
# CIDR-BASED BANNING
# ============================================================

# Enable CIDR-based automatic banning (1=enable, 0=disable)
ENABLE_CIDR_BAN=1

# CIDR attack threshold (attacks from same /24 before banning entire range)
CIDR_THRESHOLD=10

# CIDR prefix length (24 = /24, 16 = /16, etc.)
CIDR_PREFIX=24

# ============================================================
# WHITELIST SETTINGS
# ============================================================

# Whitelist file location
WHITELIST_FILE="/opt/auto-security/config/whitelist.txt"

# ============================================================
# FEATURE FLAGS
# ============================================================

# Enable/disable features (1=enable, 0=disable)
ENABLE_AUTO_BAN=1
ENABLE_MONITORING=1
ENABLE_ALERTS=1
ENABLE_CORRELATION=1

# ============================================================
# ALERT SETTINGS
# ============================================================

# Alert methods (comma-separated: log,email,webhook,telegram)
ALERT_METHODS="log"

# Email alerts
ALERT_EMAIL=""
SMTP_SERVER=""
SMTP_PORT=587
SMTP_USER=""
SMTP_PASS=""
SMTP_FROM="auto-security@router.local"

# Webhook alerts (Slack, Discord, custom)
ALERT_WEBHOOK_URL=""
ALERT_WEBHOOK_TYPE="generic"  # generic, slack, discord

# Telegram alerts
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# Alert thresholds (only alert on significant events)
ALERT_ON_NEW_BAN=1
ALERT_ON_CIDR_BAN=1
ALERT_ON_HIGH_VOLUME=100  # attacks per hour

# ============================================================
# SERVICE CORRELATION
# ============================================================

# Enable correlation with other services
ENABLE_MWAN3_CORRELATION=1
ENABLE_ADGUARD_CORRELATION=1
ENABLE_NETDATA_CORRELATION=1

# mwan3 interface names to monitor
MWAN3_INTERFACES="wan wanb"

# AdGuard Home API settings
ADGUARD_API_URL="http://127.0.0.1:3000"
ADGUARD_API_USER="admin"
ADGUARD_API_PASS_FILE="/root/adguard-admin.txt"

# Netdata settings
NETDATA_API_URL="http://127.0.0.1:19999"

# ============================================================
# LIVE MONITORING
# ============================================================

# Live monitoring timeout (seconds, 0 = no timeout)
LIVE_TIMEOUT=300

# ============================================================
# LOGGING
# ============================================================

# Log file locations
LOGFILE="/opt/auto-security/logs/banned_ips.log"
BANLIST_FILE="/opt/auto-security/logs/banlist.txt"
CIDR_BANLIST_FILE="/opt/auto-security/logs/cidr_banlist.txt"
CORRELATION_LOG="/opt/auto-security/logs/correlation.log"

# Log format: json or text
LOG_FORMAT="text"

# ============================================================
# BACKUP/RESTORE
# ============================================================

# Backup directory
BACKUP_DIR="/opt/auto-security/backup"

# Auto-save bans on shutdown
AUTO_SAVE_ON_SHUTDOWN=1

# Auto-restore bans on startup
AUTO_RESTORE_ON_STARTUP=1

# ============================================================
# PER-SERVICE THRESHOLDS (Optional - overrides ATTACK_THRESHOLD)
# ============================================================

# Uncomment and customize per-service thresholds
# SSH_THRESHOLD=3
# HTTP_THRESHOLD=20
# HTTPS_THRESHOLD=15
# RDP_THRESHOLD=2
# DNS_THRESHOLD=50
# SMTP_THRESHOLD=10

# ============================================================
# ADVANCED SETTINGS
# ============================================================

# nftables chain name (default: input_wan)
NFT_CHAIN="input_wan"

# nftables table family (default: inet)
NFT_TABLE="inet fw4"

# Log prefix to match in logread
LOG_PREFIX="Log-Blocked-WAN-Access"

# Max log entries to process per scan (prevents memory issues)
MAX_LOG_ENTRIES=10000

# ============================================================
# EXAMPLE WHITELIST ENTRIES (add to whitelist.txt)
# ============================================================
# 192.168.1.100          # Single IP
# 10.0.0.0/8             # Entire 10.x network
# 192.168.1.0/24         # LAN subnet
# fd00::/8               # ULA IPv6 range
# 2001:db8::/32          # Documentation IPv6 range